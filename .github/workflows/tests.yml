name: Tests
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify TLS fixture dependency
        run: openssl version
      - name: Install dependency intelligence support
        run: python -m pip install -r requirements-intelligence.txt
      - name: Compile source
        run: python -m compileall -q sentinel tests
      - name: Run local regression and GUI tests (Linux)
        if: runner.os == 'Linux'
        env:
          SENTINEL_REQUIRE_GUI: '1'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Run local regression and GUI tests (Windows)
        if: runner.os == 'Windows'
        env:
          SENTINEL_REQUIRE_GUI: '1'
        run: python -m unittest discover -s tests -v
