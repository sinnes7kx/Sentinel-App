[project]
name = "sentinel-backend"
version = "0.1.0"
description = "Sentinel — authorized security assessment platform (FastAPI backend)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "dnspython>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src/ layout: unambiguous package discovery. Do NOT `pip install -e` this with
# strict editable mode on a flat layout — it has been observed to delete sources.
[tool.setuptools.packages.find]
where = ["src"]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
