# Alembic CLI configuration (developer use). The application itself runs
# migrations programmatically via sentinel.db.migrate.upgrade_to_head().
[alembic]
script_location = %(here)s/src/sentinel/db/migrations
prepend_sys_path = %(here)s/src
# Leave blank: env.py falls back to the configured Sentinel database URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
